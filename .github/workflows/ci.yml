name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  functions-build:
    name: Backend (Cloud Functions) build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build

  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      # lib/firebase_options.dart is gitignored (see .gitignore).
      # It holds Firebase *client* config (public by design), so CI generates a
      # placeholder instead of consuming a secret. Analyze/test only - these
      # values never reach a running app.
      - name: Generate firebase_options.dart (CI placeholder)
        run: |
          cat > lib/firebase_options.dart <<'DART'
          // GENERATED IN CI - placeholder values, never committed.
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
                  apiKey: 'ci-placeholder',
                  appId: '1:000000000000:android:0000000000000000000000',
                  messagingSenderId: '000000000000',
                  projectId: 'klexi-ci-placeholder',
                  storageBucket: 'klexi-ci-placeholder.appspot.com',
                );
          }
          DART

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze (no fatal infos)
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage --reporter github

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  build-android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      # lib/firebase_options.dart is gitignored (see .gitignore).
      # It holds Firebase *client* config (public by design), so CI generates a
      # placeholder instead of consuming a secret. Analyze/test only - these
      # values never reach a running app.
      - name: Generate firebase_options.dart (CI placeholder)
        run: |
          cat > lib/firebase_options.dart <<'DART'
          // GENERATED IN CI - placeholder values, never committed.
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
                  apiKey: 'ci-placeholder',
                  appId: '1:000000000000:android:0000000000000000000000',
                  messagingSenderId: '000000000000',
                  projectId: 'klexi-ci-placeholder',
                  storageBucket: 'klexi-ci-placeholder.appspot.com',
                );
          }
          DART

      - name: Install dependencies
        run: flutter pub get

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KEYSTORE_BASE64 / KEY_PROPERTIES secrets not set - skipping release AAB build."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/klexi-release.jks
          printf '%s' "$KEY_PROPERTIES" > android/key.properties

      - name: Build release AAB
        if: steps.signing.outputs.available == 'true'
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: klexi-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
